name: Publish API and Hub API

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the release tag

    steps:
      - name: Checkout code # zizmor: ignore[artipacked]
        # Credentials are intentionally persisted: the "Create and Push Tag" step pushes a tag to origin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Uses the `toolchain` directive from go.mod (both modules pin the same toolchain).
          go-version-file: generated/neynar_sdk/go.mod
          cache: false

      - name: Build API
        run: |
          cd generated/neynar_sdk
          go build

      - name: Build Hub API
        run: |
          cd generated/neynar_hub_sdk
          go build

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Create and Push Tag
        run: |
          # Parse version from openapi.yaml using yq
          VERSION=$(yq '.info.version' generated/neynar_sdk/api/openapi.yaml)
          if [ -z "$VERSION" ]; then
            echo "Could not determine version from openapi.yaml"
            exit 1
          fi
          TAG_NAME="v$VERSION"
          # Only create tag if it doesn't already exist
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "INFO: Tag $TAG_NAME already exists; updating it."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME"
          git push -f origin "$TAG_NAME"
